apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: console-shop
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: asia-southeast1-docker.pkg.dev/agentassistant-496719/console-shop/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: api-gateway-secret
          env:
            - name: GIN_MODE
              value: "release"
            - name: PORT
              value: "8000"
            # Route to internal ClusterIP services
            - name: BACKEND_URL
              value: "http://console-backend:3012"
            - name: PAYMENT_GATEWAY_URL
              value: "http://payment-gateway-service:8080"
            - name: ALLOWED_ORIGINS
              value: "https://console-shop-web.lboevset.com,https://console-shop-admin.lboevset.com,https://hospital-web.lboevset.com,https://hospital-admin.lboevset.com"
            - name: HOSPITAL_BACKEND_URL
              value: "http://hospital-backend.bangkok-hospital.svc.cluster.local:3000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
