apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: console-shop
  labels:
    app: api-gateway
  annotations:
    cloud.google.com/app-protocols: '{"http":"HTTP"}'
spec:
  # NodePort so the GKE Ingress can route external HTTPS traffic to it
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
